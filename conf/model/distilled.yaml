name: distilled
type: classifier
num_classes: ${dataset.num_classes}

architecture:
  base: resnet18_partial
  layers: [conv1, conv2_x, conv3_x]
  features_dim: 128

classifier:
  hidden_dim: 64
  dropout: 0.3

distillation:
  teacher_model: resnet18
  teacher_pretrained: true
  temperature: 4.0
  alpha: 0.7

training:
  optimizer: adamw
  lr: ${train.lr}
  weight_decay: 1e-4
  scheduler: cosine
