max_epochs: ${train.epochs}
log_every_n_steps: 20
accelerator: gpu
devices: 1
precision: 16-mixed
callbacks:
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val/loss
    patience: 10
    mode: min
model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val/loss
  mode: min
  save_top_k: 1
  filename: "best-{epoch:02d}-{val_loss:.4f}"