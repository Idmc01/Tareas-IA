defaults:
  - model: cnn_scratch
  - trainer: default
  - logger: wandb
  - _self_

dataset:
  root: data
  class_name: ["bottle", "cable", "capsule", "grid", "pill", "screw", "tile", "toothbrush", "transistor", "zipper"]
  img_size: 224
  batch_size: 32
  num_classes: 10

train:
  lr: 1e-3
  epochs: 50
